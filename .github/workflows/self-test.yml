name: Self Test
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v6
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Install current stable Swift
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --exact --source winget --silent --accept-source-agreements --accept-package-agreements
          $swiftBin = Resolve-Path "$env:LOCALAPPDATA\Programs\Swift\Toolchains\*\usr\bin" | Sort-Object Path -Descending | Select-Object -First 1 -ExpandProperty Path
          $runtimeBin = Resolve-Path "$env:LOCALAPPDATA\Programs\Swift\Runtimes\*\usr\bin" | Sort-Object Path -Descending | Select-Object -First 1 -ExpandProperty Path
          $sdkRoot = Resolve-Path "$env:LOCALAPPDATA\Programs\Swift\Platforms\*\Windows.platform\Developer\SDKs\Windows.sdk" | Sort-Object Path -Descending | Select-Object -First 1 -ExpandProperty Path
          $swiftBin | Out-File $env:GITHUB_PATH -Append
          $runtimeBin | Out-File $env:GITHUB_PATH -Append
          "SDKROOT=$sdkRoot" | Out-File $env:GITHUB_ENV -Append
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: python -m unittest discover -s tests -v
  apple:
    runs-on: macos-26
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v6
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Installed Xcode and SDK inventory
        run: APPLE_XCODE=stable bash macos/apple-authority.sh sdk-info
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Real SwiftUI SDK typecheck
        run: |
          printf 'import SwiftUI\nstruct V: View { var body: some View { Text("ok") } }\n' > valid.swift
          APPLE_PATH=valid.swift APPLE_SDK=macosx bash macos/apple-authority.sh typecheck
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Invalid Apple API gives concise diagnostics
        run: |
          printf 'import SwiftUI\nlet value = DefinitelyNotAnAppleAPI()\n' > invalid.swift
          if APPLE_PATH=invalid.swift APPLE_SDK=macosx bash macos/apple-authority.sh typecheck > invalid.out 2>&1; then exit 1; fi
          grep -E 'error:|full_log=' invalid.out | tail -20
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: SDK symbol query
        env: {APPLE_MODULE: SwiftUI, APPLE_SYMBOL: searchable, APPLE_SDK: macosx}
        run: bash macos/apple-authority.sh api
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Signing and entitlement inspection
        run: |
          printf 'print("ok")\n' > signed.swift
          xcrun swiftc signed.swift -o signed-tool
          codesign -s - signed-tool
          APPLE_PATH=signed-tool bash macos/apple-authority.sh entitlements
          bash macos/apple-authority.sh signing-doctor
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Pinned XcodeBuildMCP
        run: npx -y xcodebuildmcp@2.7.0 --help >/dev/null
